name: Update IPTV sources

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "scripts/**"
      - ".github/workflows/update.yml"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and merge sources
        run: python scripts/update.py

      - name: Commit output if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/live.m3u output/live.txt
          if git diff --staged --quiet; then
            echo "No changes in output/"
          else
            git commit -m "chore: update IPTV playlist $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
